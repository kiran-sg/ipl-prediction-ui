<div class="prediction-container">
  <div class="page-banner">
    <h1 class="banner-title">🏏 IPL Prediction Contest</h1>
  </div>
  <div class="prediction-row">
    <button mat-flat-button class="history-btn" (click)="openPreviousPredictionsDialog()">
      <mat-icon>history</mat-icon> My Predictions
    </button>
    <button mat-fab extended class="tournament-prediction"
        (click)="openTournamentPredictionDialog()">
      <div class="button-content">
        <mat-icon>emoji_events</mat-icon>
        <div class="text-column">
          <span class="main-text">Season Predictor</span>
        </div>
      </div>
    </button>
  </div>
  <div class="card-container">
    <ng-container *ngFor="let match of matches">
      <mat-card class="match-card">
        <mat-card-header class="match-header">
          <div mat-card-avatar></div>
        </mat-card-header>
        <mat-card-content>
          <div class="match-name-container">
            <h3 class="match-name">
              {{ match.name }}
            </h3>
          </div>
          <div class="prediction-pending-badge-container">
            <span *ngIf="!match.isPredicted && !match.isLocked && match.home !== 'TBC' && match.away !== 'TBC'"
              class="prediction-pending-badge">
              Prediction Pending
            </span>
          </div>
          <div class="team-logos">
            <div class="logo-container">
              <img [src]="match.homeLogo" alt="Team 1 Logo" class="team-logo">
            </div>
            <div class="logo-container">
              <img src="assets/ipl/versus.avif" alt="Versus Logo" class="versus-logo">
            </div>
            <div class="logo-container">
              <img [src]="match.awayLogo" alt="Team 2 Logo" class="team-logo">
            </div>
          </div>
          <p class="match-date">{{ match.dateTime | customDate }}</p>
        </mat-card-content>
        <mat-card-actions class="match-actions">
          <div *ngIf="!match.isLocked && match.isToday" class="locks-at-badge">
            🔒 Predictions lock at {{ match.predictionLockingTime }} IST
          </div>
          <button mat-flat-button
            [disabled]="match.isLocked || match.home === 'TBC' || match.away === 'TBC'"
            class="predict-match-button"
            [class.has-pending]="!match.isPredicted"
            (click)="openPredictDialog(match)">
            <div class="button-content">
              <div class="text-column">
                <span class="main-text">{{ match.isPredicted ? 'Edit Prediction' : 'Predict Match' }}</span>
              </div>
            </div>
          </button>
        </mat-card-actions>
      </mat-card>
    </ng-container>
  </div>
  <div class="no-matches-banner" *ngIf="matches.length === 0">
    🏏 No upcoming matches at the moment. Stay tuned!
  </div>
</div>
