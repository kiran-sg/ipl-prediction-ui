<div class="login-container">
  <img src="assets/batter.png" alt="Batter" class="batter-img">
  <mat-card class="login-card">
    <div class="login-header">
      <div class="login-logos">
        <img src="assets/fuelup/fuel-up-logo.png" alt="Fuel Up Logo" class="login-logo">
        <img src="assets/fuelup/mascot.png" alt="Mascot" class="login-mascot">
      </div>
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to make your predictions</p>
    </div>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>User ID</mat-label>
          <input matInput formControlName="userId" type="text" required>
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('userId')?.hasError('required')">
            User ID is required
          </mat-error>
        </mat-form-field>

        <mat-error *ngIf="invalidPwd" style="padding-bottom: 20px;">
          Invalid User ID
        </mat-error>

        <button mat-raised-button color="primary" type="submit" class="full-width login-btn" [disabled]="loginForm.invalid">
          Login
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
