<form [formGroup]="predictForm" (ngSubmit)="onSubmit()" class="predict-form">

  <!-- Surge Section -->
  <div class="surge-section" [class.surge-active]="isSurgeActive">
    <div class="surge-header">
      <span class="surge-icon">⚡</span>
      <span class="surge-title">SURGE MODE</span>
      <span class="surge-badge">x2 Points</span>
    </div>
    <p class="surge-description">
      Activate surge to double your points for this match.
      You have <strong>{{ surgesRemaining }}</strong> surge{{ surgesRemaining !== 1 ? 's' : '' }} remaining.
    </p>
    <button type="button" class="surge-toggle-btn"
      [class.active]="isSurgeActive"
      [disabled]="surgesRemaining <= 0 && !isSurgeActive"
      (click)="toggleSurge()">
      {{ isSurgeActive ? '⚡ Surge Activated' : 'Activate Surge' }}
    </button>
  </div>

  <app-team-selector
    [teams]="teams"
    label="Toss Winner"
    [selected]="predictForm.get('tossPredicted')?.value"
    (selectionChange)="onSelect('tossPredicted', $event)">
  </app-team-selector>

  <app-team-selector
    [teams]="teams"
    label="Match Winner"
    [showNoResult]="true"
    [selected]="predictForm.get('teamPredicted')?.value"
    (selectionChange)="onSelect('teamPredicted', $event)">
  </app-team-selector>

  <app-score-selector
    [options]="firstInnScoreOptions"
    label="First Innings Score"
    [selected]="predictForm.get('firstInnScorePredicted')?.value"
    (selectionChange)="onSelect('firstInnScorePredicted', $event)">
  </app-score-selector>

  <app-player-selector
    [players]="players"
    label="FUEL UP Batter"
    [defaultCategories]="['Batter', 'WK-Batter', 'All-Rounder']"
    [selected]="predictForm.get('mostRunsScorerPredicted')?.value"
    (selectionChange)="onSelect('mostRunsScorerPredicted', $event)">
  </app-player-selector>

  <app-player-selector
    [players]="players"
    label="FUEL UP Bowler"
    [defaultCategories]="['Bowler', 'All-Rounder']"
    [selected]="predictForm.get('mostWicketsTakerPredicted')?.value"
    (selectionChange)="onSelect('mostWicketsTakerPredicted', $event)">
  </app-player-selector>

  <app-player-selector
    [players]="players"
    label="FUEL UP Man of the Match"
    [defaultCategories]="[]"
    [selected]="predictForm.get('momPredicted')?.value"
    (selectionChange)="onSelect('momPredicted', $event)">
  </app-player-selector>
</form>
