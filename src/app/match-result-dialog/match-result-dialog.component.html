<div class="session-banner" *ngIf="sessionTimer">Session expires in <strong>{{ sessionTimer }}</strong></div>
<h2 mat-dialog-title class="dialog-title">
  <mat-icon class="title-icon">sports_cricket</mat-icon>
  {{matchDetails.home}} vs {{matchDetails.away}}
  <span class="match-date-subtitle">Update Result</span>
</h2>

<form [formGroup]="resultForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    @if (!isNoResult) {
      <app-team-selector
        [teams]="teams"
        label="Toss Winner"
        [showNoResult]="true"
        [selected]="resultForm.get('tossWon')?.value"
        (selectionChange)="onSelect('tossWon', $event)">
      </app-team-selector>
    }

    <app-team-selector
      [teams]="teams"
      label="Match Winner"
      [showNoResult]="true"
      [selected]="resultForm.get('teamWon')?.value"
      (selectionChange)="onSelect('teamWon', $event)">
    </app-team-selector>

    @if (isNoResult) {
      <div class="no-result-info">
        🚫 No Result selected — other fields are not required.
      </div>
    }

    @if (!isNoResult) {
      <app-score-selector
        [options]="firstInnScoreOptions"
        label="First Innings Score"
        [selected]="resultForm.get('firstInnScore')?.value"
        (selectionChange)="onSelect('firstInnScore', $event)">
      </app-score-selector>
    }

    @if (!isNoResult) {
      <app-player-selector
        [players]="players"
        label="FUEL UP Batter"
        [defaultCategories]="['Batter', 'WK-Batter', 'All-Rounder']"
        [selected]="resultForm.get('mostRunsScorer')?.value"
        (selectionChange)="onSelect('mostRunsScorer', $event)">
      </app-player-selector>

      <app-player-selector
        [players]="players"
        label="FUEL UP Bowler"
        [defaultCategories]="['Bowler', 'All-Rounder']"
        [selected]="resultForm.get('mostWicketsTaker')?.value"
        (selectionChange)="onSelect('mostWicketsTaker', $event)">
      </app-player-selector>

      <app-player-selector
        [players]="players"
        label="FUEL UP Man of the Match"
        [defaultCategories]="[]"
        [selected]="resultForm.get('playerOfTheMatch')?.value"
        (selectionChange)="onSelect('playerOfTheMatch', $event)">
      </app-player-selector>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button cdkFocusInitial type="submit">Update Result</button>
  </mat-dialog-actions>
</form>
